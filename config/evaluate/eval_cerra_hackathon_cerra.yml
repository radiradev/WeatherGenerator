evaluation:
  metrics: [rmse, mae]
  score_plots: [metric_plots, bar]
  summary_dir: "/iopsstor/scratch/cscs/course_5a417627/inference_cerra/eval/"
  plot_ensemble: false
  print_summary: true
  log_scale: false
  add_grid: false

default_streams:
  CERRA:
    regions: ["europe"]
    channels: ["10si", "r_850"]
    evaluation:
      forecast_step: "all"
      sample: "all"
    plotting:
      sample: [0]
      forecast_step: [1]
      data_plots:
        - maps:
            predictions: [image]
            target: [image]
            bias: [image]

