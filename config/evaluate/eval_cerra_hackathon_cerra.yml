  rlufinf0: {label: "CERRA+ERA5 input, no FE", runplot_base_dir: "/iopsstor/scratch/cscs/course_5a417627/inference_cerra/eval/rlufinf0", metrics_base_dir: "/iopsstor/scratch/cscs/course_5a417627/inference_cerra/eval/rlufinf0"}
